# SoulJars configuration
options:
  # Keeps the original mobs list fully user-controlled while also enabling
  # the maintained modern Minecraft additions below.
  include-modern-mobs: true

# Original/legacy roster. Existing server configs keep their own version of
# this list, so custom removals and additions are preserved.

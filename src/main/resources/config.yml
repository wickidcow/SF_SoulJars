# Modern defaults keep common/passive mobs below the classic 128 cost and reserve
# higher requirements for dangerous or rarer mobs. Existing server values win.
# Any mob without an explicit value keeps SoulJars' classic default of 128 souls.
souls-required:
  ALLAY: 64
  ARMADILLO: 64
  AXOLOTL: 64
  BEE: 64
  BOGGED: 128
  BREEZE: 192
  CAMEL: 64
  CAMEL_HUSK: 128
  CAT: 64
  COPPER_GOLEM: 128
  CREAKING: 192
  FROG: 64
